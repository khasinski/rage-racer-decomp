name: Main Executable (Demo One v5) - Rage Racer (Demo)
sha1: 6e706fd58000734707b2fe793161e5cc1ada7bed
options:
  basename: main
  target_path: assets/DEMO/main.exe
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/DEMO/main
  src_path: src/main
  build_path: build/DEMO
  ld_script_path: linkers/DEMO/main.ld

  migrate_rodata_to_functions: False
  find_file_boundaries: True
  hasm_in_src_path: True

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - configs/DEMO/sym.main.txt
  reloc_addrs_path:
    - configs/DEMO/rel.main.txt

  undefined_funcs_auto_path: linkers/DEMO/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/DEMO/undefined_syms_auto.main.txt

  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: True

# PS-X EXE layout for the Demo One v5 Rage Racer demo (RAGE/RAGE.EXE):
#   header   0x000000 - 0x000800
#   .text   @ vram 0x80018000, size 0x8A000, ends @ 0x800A2000
#   entry PC = 0x80069EB8
#   stack top = 0x801FFFF0
#   This build loads 0x8000 bytes higher than PAL/USA/JAP10/JAP11, which all
#   load at 0x80010000. It is a pre-release snapshot (27 Feb 1997, one week
#   before the 6 Mar 1997 USA retail build) and shares most compiled object
#   code with the retail builds; see tools/scripts/map_version_functions.py
#   and port_pal_text_units.py --target-load-address.
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80018000
    align: 4
    subalign: 4
    bss_size: 0x159338
