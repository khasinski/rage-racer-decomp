options:
  basename: main
  target_path: assets/JAP10/main.exe
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/JAP10/main
  src_path: src/main
  build_path: build/JAP10
  ld_script_path: linkers/JAP10/main.ld

  migrate_rodata_to_functions: False
  find_file_boundaries: True

  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - configs/JAP10/sym.main.txt
  reloc_addrs_path:
    - configs/JAP10/rel.main.txt

  undefined_funcs_auto_path: linkers/JAP10/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/JAP10/undefined_syms_auto.main.txt

  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  ld_bss_is_noload: True

# PS-X EXE layout for Japanese v1.0 SLPS_006.00:
#   header   0x000000 - 0x000800
#   payload  @ vram 0x80010000, size 0x8A800, ends @ 0x8009A800
#   entry PC = 0x80062910
#   stack top = 0x801FFFF0
segments:
  - name: header
    type: header
    start: 0x0

  # The v1.0 mastering left non-ASCII build data in the otherwise reserved
  # header tail. Splat's PS-X header decoder expects that range to be text, so
  # preserve it as raw assembly instead of discarding or sanitising it.
  - name: header_tail
    type: code
    start: 0x7C
    vram: 0x7C
    align: 4
    subalign: 4
    subsegments:
      - [0x7C, asm, header_tail]
      - [0x800]

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subalign: 4
    bss_size: 0x0
